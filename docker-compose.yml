version: '3.8'

services:
  servidor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto_servidor
    ports:
      - "8080:8080"
    restart: unless-stopped

  motorista:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto_motorista
    command: ["/app/bin/motorista", "-servidor", "servidor:8080"]
    stdin_open: true
    tty: true
    depends_on:
      - servidor
    profiles:
      - clientes

  passageiro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto_passageiro
    command: ["/app/bin/passageiro", "-servidor", "servidor:8080"]
    stdin_open: true
    tty: true
    depends_on:
      - servidor
    profiles:
      - clientes

  teste_carga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaijunto_teste_carga
    command: ["/app/bin/teste_carga", "-servidor", "servidor:8080", "-clientes", "30", "-vagas", "5"]
    depends_on:
      - servidor
    profiles:
      - teste
